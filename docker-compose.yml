services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER is required}
      POSTGRES_PASSWORD: ${DATABASE_PASS:?DATABASE_PASS is required}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - ./.docker/database:/docker-entrypoint-initdb.d:ro
      - database_volume:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Garante os bancos isolados mesmo em volumes criados antes deste recurso.
  prepare-databases:
    build:
      context: .
      dockerfile: app/Dockerfile
      target: builder
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASS}@postgres:5432/${DATABASE_NAME}
    command: ["pnpm", "tsx", "scripts/ensure-aux-databases.ts"]

  # Dispara na subida: aplica migrações e cria a massa de teste. Nenhum e-mail é
  # enviado; os links/códigos ficam no arquivo local e no console do serviço.
  seed-test-data:
    build:
      context: .
      dockerfile: app/Dockerfile
      target: builder
    restart: "no"
    depends_on:
      prepare-databases:
        condition: service_completed_successfully
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASS}@postgres:5432/${DATABASE_NAME}
      AUDIT_DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASS}@postgres:5432/${DATABASE_NAME}_audit
      BACKUP_TEST_DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASS}@postgres:5432/${DATABASE_NAME}_backup_test
      # Dentro do container o diretório montado é sempre /tmp/opencode.
      TEST_DATA_OUTPUT_DIR: /tmp/opencode
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - ./tmp/test-data:/tmp/opencode
    command:
      - sh
      - -c
      - pnpm db:deploy && pnpm db:seed:test && chown -R "$HOST_UID:$HOST_GID" /tmp/opencode

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      prepare-databases:
        condition: service_completed_successfully
      seed-test-data:
        condition: service_started
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASS}@postgres:5432/${DATABASE_NAME}
      AUDIT_DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASS}@postgres:5432/${DATABASE_NAME}_audit
      BACKUP_TEST_DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASS}@postgres:5432/${DATABASE_NAME}_backup_test
    expose: ["3000"]

  # Terminação TLS local: o Next roda HTTP internamente e o Caddy serve HTTPS
  # em localhost:3000, com certificado autoassinado (11.2.1/12.3).
  tls-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports: ["${PORT:? PORT is required}:3000"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # 11.3.1: agendamento automático no mesmo segredo de manutenção do endpoint
  # protegido. Frequências (UTC) definidas em BACKUP_SCHEDULE (backup-service):
  # FULL semanal (0 3 * * 0), INCREMENTAL diário (30 2 * * *),
  # SEMESTER_CLOSING no início de janeiro/julho (0 4 1 1,7 *).
  backup-scheduler:
    build:
      context: .
      dockerfile: app/Dockerfile
      target: builder
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASS}@postgres:5432/${DATABASE_NAME}
      BACKUP_SCHEDULER_URL: http://app:3000/api/maintenance/backup
      MAINTENANCE_SECRET: ${MAINTENANCE_SECRET:?MAINTENANCE_SECRET is required}
    command: ["pnpm", "backup", "schedule"]

volumes:
  database_volume:
  caddy_data:
  caddy_config:
