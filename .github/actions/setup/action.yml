name: Setup (Node + pnpm + Prisma)
description: >-
  Checkout, instala pnpm/Node, dependências com lockfile congelado e gera o
  Prisma Client. Compartilhada por todos os workflows reutilizáveis de check.

inputs:
  fetch-depth:
    description: "Profundidade do checkout (0 = histórico completo)."
    required: false
    default: "1"
  ref:
    description: "Ref a checar; vazio usa github.ref."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        ref: ${{ inputs.ref || github.ref }}

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 12.17.0
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Generate Prisma Client
      shell: bash
      run: pnpm db:generate
