# Check isolado, reutilizado pelo orquestrador ci.yml.
# O comando real vive em .github/hooks/checks.sh (fonte única para CI + hooks).

name: Check · Build

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref a checar (vazio = github.ref)."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Setup (Node + pnpm + Prisma)
        uses: ./.github/actions/setup
        with:
          ref: ${{ inputs.ref }}
      - name: Production build
        run: sh .github/hooks/checks.sh build
        env:
          BETTER_AUTH_SECRET: ci-placeholder-not-used-at-runtime-000000
          BETTER_AUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://localhost:5432/ci
          DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          MAINTENANCE_SECRET: ci-maintenance-secret-000000
          AUDIT_DATABASE_URL: postgresql://localhost:5432/audit
          BACKUP_TEST_DATABASE_URL: postgresql://localhost:5432/audit_test
