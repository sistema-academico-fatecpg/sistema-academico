# Check isolado, reutilizado pelo orquestrador ci.yml.
# O comando real vive em .github/hooks/checks.sh (fonte única para CI + hooks).

name: Check · Coverage

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref a checar (vazio = github.ref)."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Setup (Node + pnpm + Prisma)
        uses: ./.github/actions/setup
        with:
          ref: ${{ inputs.ref }}
      - name: Vitest coverage
        run: sh .github/hooks/checks.sh coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
