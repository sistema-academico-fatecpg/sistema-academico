# Check isolado, reutilizado pelo orquestrador ci.yml.
# O comando real vive em .github/hooks/checks.sh (fonte única para CI + hooks).

name: Check · Governance

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref a checar (vazio = github.ref)."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  # 12.5: necessário para consultar a proteção da branch main via gh api.
  administration: read

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.17.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Code review / branch protection (12.5)
        run: |
          sh .github/hooks/checks.sh governance > governance.log 2>&1
          status=$?
          cat governance.log
          exit $status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # 12.5: falha o CI quando revisão/checks obrigatórios estiverem ausentes.
          REQUIRE_BRANCH_PROTECTION: "1"

      - name: Exige branch protection efetiva (12.5)
        if: always()
        shell: bash
        run: |
          # check-branch-protection.ts apenas avisa quando a API não responde
          # (proteção ausente/fork). Em CI isso precisa ser uma falha.
          if [ -f governance.log ] && grep -q 'Aviso:' governance.log; then
            echo "Falha: revisão/checks obrigatórios ausentes ou branch protection inacessível (12.5)." >&2
            exit 1
          fi
