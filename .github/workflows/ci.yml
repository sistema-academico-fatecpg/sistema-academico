# Orquestrador de TODOS os checks.
#
# Cada check é um workflow reutilizável em check-*.yml e aparece como um status
# check independente no PR. Todos compartilham:
#   - setup inline (checkout + Node + pnpm + Prisma) em cada check-*.yml
#   - .github/hooks/checks.sh      (os comandos, usados também pelos git hooks)
#
# Antes havia um job que fazia `pnpm check:fix` e dava push automático de
# formatação para o PR. Isso foi removido: os hooks locais (pre-commit) agora
# garantem a formatação antes do commit, e todo check no CI é somente-leitura.

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    # Verificação semanal completa (segunda, 03:17 UTC).
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    uses: ./.github/workflows/check-conventional-commits.yml

  format:
    uses: ./.github/workflows/check-format.yml

  lint:
    uses: ./.github/workflows/check-lint.yml

  biome:
    uses: ./.github/workflows/check-biome.yml

  typecheck:
    uses: ./.github/workflows/check-typecheck.yml

  tests:
    uses: ./.github/workflows/check-tests.yml

  coverage:
    uses: ./.github/workflows/check-coverage.yml

  build:
    uses: ./.github/workflows/check-build.yml

  secrets:
    uses: ./.github/workflows/check-secrets.yml

  dependencies:
    uses: ./.github/workflows/check-dependencies.yml

  env:
    uses: ./.github/workflows/check-env.yml

  database:
    uses: ./.github/workflows/check-database.yml
